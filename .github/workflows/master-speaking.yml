name: Build Master Speaking proof editions

on:
  push:
    branches:
      - main
      - editorial/master-speaking-publication-20261023
      - quality/20-angle-deep-audit-20261023
  workflow_dispatch:

permissions:
  contents: write

jobs:
  master-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: build_spec/requirements.txt
      - name: Install print and ebook engines
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer pandoc fonts-dejavu-core
          python -m pip install -r build_spec/requirements.txt
      - name: Audit original manuscript
        run: python tools/audit_master_speaking.py
      - name: Extract full listening sections for substantive review
        run: python tools/extract_listening_chapters.py
      - name: Build accountable source/evidence and media inventory
        run: python tools/audit_master_content.py
      - name: Generate DOCX, A4 PDF, EPUB3 and HTML proof builds
        run: python tools/build_master_publication.py
      - name: Enforce twenty-lens structural audit and record expert review gaps
        run: python tools/quality_audit_20.py
      - name: Validate both Grammar for Special Speaking editions
        run: |
          python build_spec/qa.py
          python tools/validate_publication.py
      - name: Upload publication proofs
        uses: actions/upload-artifact@v4
        with:
          name: master-speaking-publication-proofs
          path: |
            proof/
            docs/master-speaking-publication-audit.md
            docs/quality-audit-20-dimensions.md
            docs/master-speaking-content-evidence.md
            docs/listening-lesson-review.md
          if-no-files-found: error
      - name: Commit reproducible proof files on editorial branch
        if: (github.ref == 'refs/heads/editorial/master-speaking-publication-20261023' || github.ref == 'refs/heads/quality/20-angle-deep-audit-20261023') && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proof/ docs/master-speaking-publication-audit.md docs/master-speaking-heading-inventory.md docs/quality-audit-20-dimensions.md docs/master-speaking-content-evidence.md docs/listening-lesson-review.md
          if ! git diff --cached --quiet; then
            git commit -m "build: publish structurally checked Master Speaking proof editions"
            for attempt in 1 2 3; do
              if git push origin HEAD:"${GITHUB_REF_NAME}"; then
                exit 0
              fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep $((5 * attempt))
            done
          fi
